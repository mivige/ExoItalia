# Partner e sostenitori mostrati in home. Chiave = slug univoco, usato come id.
#
# Per aggiungere un partner, copia questo blocco e cambia i valori
# (guida completa in CONTENT.md):
#
# slug-nuovo-partner:
#   nome: "Nome Partner"
#   url: "https://esempio.it"
#   tipo: "partner" # partner | sostenitore | patrocinio
#   logo: "/images/partners/slug-nuovo-partner.svg" # opzionale, altrimenti placeholder
#
# TODO: da confermare con il team la classificazione "tipo" di ciascun
# partner (partner / sostenitore / patrocinio) — qui impostata di default
# a "partner" in assenza di indicazioni nel brief.

